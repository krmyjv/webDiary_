<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | My Diary</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        html{
            scroll-behavior:smooth;
        }

        body{
            background:#0a192f;
            color:white;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            overflow-x:hidden;
        }

        header{
            padding:20px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:4px solid #ffd60a;
            background:#081221;
        }

        header h1{
            font-size:32px;
            font-weight:700;
        }

        header h1 a{
            text-decoration:none;
            color:#ffd60a;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin-left:25px;
            font-size:18px;
            font-weight:600;
            transition:0.3s;
        }

        nav a:hover{
            color:#ffd60a;
            text-decoration:underline;
        }

        section{
            flex:1;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:50px 20px;
        }

        .contact-card{
            background:#112240;
            border:3px solid #ffd60a;
            border-radius:20px;
            padding:40px;
            width:100%;
            max-width:600px;
            text-align:center;
            box-shadow:10px 10px 0px rgba(0,0,0,0.5);
            transition:0.3s;
        }

        .contact-card:hover{
            transform:translateY(-5px);
        }

        .contact-card h2{
            font-size:40px;
            margin-bottom:25px;
            color:#ffd60a;
            border-bottom:6px solid #64b5ff;
            display:inline-block;
            padding-bottom:8px;
        }

        .contact-info{
            font-size:20px;
            line-height:2;
            color:#dbeafe;
        }

        .contact-info strong{
            display:block;
            font-size:22px;
            margin-top:20px;
            color:#64b5ff;
        }

        .contact-info a{
            color:white;
            text-decoration:none;
        }

        .contact-info a:hover{
            color:#ffd60a;
            text-decoration:underline;
        }

        footer{
            padding:20px;
            border-top:4px solid #ffd60a;
            text-align:center;
            font-weight:600;
            background:#081221;
            color:white;
        }

        /* Responsive */

        @media(max-width:900px){

            header{
                flex-direction:column;
                gap:15px;
            }

            nav a{
                margin:0 10px;
                font-size:16px;
            }

            .contact-card{
                padding:25px;
            }

            .contact-card h2{
                font-size:30px;
            }

            .contact-info{
                font-size:18px;
            }
        }

    </style>
</head>

<body>

<header>

    <h1>
        <a href="index.html">My Diary</a>
    </h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="diary.html">Diary</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>

<section>

    <div class="contact-card">

        <h2>Contact Me</h2>

        <div class="contact-info">

            <strong>Email</strong>
            <p>
                <a href="mailto:jaymarkvillacorta83@gmail.com">
                    jaymarkvillacorta83@gmail.com
                </a>
            </p>

            <strong>Phone</strong>
            <p>
                <a href="tel:09938537500">
                    0993 853 7500
                </a>
            </p>

        </div>

    </div>

</section>

<footer>
     My Diary 
</footer>

</body>
</html>
